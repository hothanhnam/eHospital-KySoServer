<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu Hình API SMS NetPlus - eHospital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --success: #10b981;
            --error: #ef4444;
            --ring-color: rgba(59, 130, 246, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--surface-color);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid var(--border-color);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            padding: 30px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="password"],
        input[type="url"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--ring-color);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .alert.success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: block;
        }

        .alert.error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Cấu Hình API NetPlus</h1>
            <p>Quản lý kết nối WebService SMS cho eHospital</p>
        </div>
        
        <div class="form-content">
            <div id="alertBox" class="alert"></div>

            <form id="configForm">
                <div class="form-group">
                    <label for="url">URL WebService Chính</label>
                    <input type="url" id="url" required placeholder="http://svc.netplus.vn/WSSendSMS.asmx">
                </div>
                
                <div class="form-group">
                    <label for="fallbackUrl">URL Dự Phòng</label>
                    <input type="url" id="fallbackUrl" placeholder="http://svc3.netplus.vn/WSSendSMS.asmx">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="maTruong">Mã Trường (maTruong)</label>
                        <input type="text" id="maTruong" required placeholder="VD: BV-VinhDuc">
                    </div>
                    <div class="form-group">
                        <label for="companyCode">Company Code</label>
                        <input type="text" id="companyCode" required placeholder="VD: BV-VinhDuc">
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Tên đăng nhập (Username)</label>
                    <input type="text" id="username" required placeholder="Account KH do NetPlus cấp">
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu (Password)</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="Nhập mật khẩu API">
                        <button type="button" class="toggle-password" onclick="togglePassword()">Hiện</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="smsType">SMS Type</label>
                    <input type="number" id="smsType" required value="1" placeholder="Mặc định: 1">
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <div class="btn-content">
                        <span class="spinner" id="spinner"></span>
                        <span id="btnText">Lưu Cấu Hình</span>
                    </div>
                </button>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
</body>
</html>
