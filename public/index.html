<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eHospital - Cổng Ký Số Điện Tử</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.0.17">
    <style>
        .filter-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-row .input-group { flex: 1; min-width: 200px; margin-bottom: 0; }
        .filter-row .input-group label { font-size: 0.8rem; text-transform: uppercase; color: #8892b0; margin-bottom: 5px; display: block; }
        .tabs-container { display: flex; gap: 10px; margin-bottom: 15px; background: var(--card-bg); padding: 5px; border-radius: 30px; border: 1px solid var(--glass-border); width: fit-content; }
        .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px 24px; border-radius: 20px; font-size: 1.1rem; font-weight: 500; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
        .tab-btn.active { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--glass-border); }
        .badge { background: transparent; color: inherit; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
        .tab-btn.active .badge { background: var(--input-border); }
        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .page-controls { display: flex; gap: 10px; align-items: center; }
        
        .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; }
        .status-chua-ky { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .status-da-ky { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-loi { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- MÀN HÌNH LOGIN -->
    <div id="login-view" class="view active">
        <div class="glass-panel login-box">
            <div onclick="toggleTheme()" class="theme-toggle" title="Đổi giao diện">
    <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
</div>
            <div class="logo">
                
                <div style="margin-bottom:10px;"><img src="https://vinhduchospital.com/wp-content/uploads/2023/04/Logo_Benh-Vien.png" style="height: 60px; object-fit: contain;" alt="Logo Bệnh Viện"></div>
            </div>
            <p class="subtitle">Hệ thống Ký số Từ xa</p>
            
            <form id="login-form">
                <div class="input-group">
                    <label>Máy chủ</label>
                    <div class="agent-select-wrapper" style="display: flex; gap: 8px;">
                        <select autocomplete="off" id="agent-select" class="form-control" required style="flex-grow: 1;">
                            <option value="">Đang tải danh sách Agent...</option>
                        </select>
                        <button type="button" id="btn-refresh-agents" class="btn-secondary" style="padding: 12px;" title="Làm mới danh sách">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label>Tên đăng nhập</label>
                    <input autocomplete="off" type="text" id="username" class="form-control" placeholder="Nhập tài khoản" required>
                </div>
                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input autocomplete="off" type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
                </div>
                <div id="login-error" class="error-msg"></div>
                <button type="submit" class="btn-primary">
                    <span>Đăng Nhập</span>
                </button>
            </form>
        </div>
    </div>

    <!-- MÀN HÌNH DASHBOARD -->
    <div id="dashboard-view" class="view">
        <nav class="navbar glass-panel">
            <div class="nav-brand">
                
                <img src="https://vinhduchospital.com/wp-content/uploads/2023/04/Logo_Benh-Vien.png" style="height: 35px; object-fit: contain;" alt="Logo">
            </div>
            <div class="nav-user">
                <div onclick="toggleTheme()" class="theme-toggle" title="Đổi giao diện">
    <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
</div>
                <span id="user-greeting">Xin chào, Bác sĩ</span>
                <button id="btn-logout" class="btn-secondary">Đăng xuất</button>
            </div>
        </nav>

        <main class="dashboard-content">
            <div class="glass-panel main-panel">
                <div class="panel-header" style="margin-bottom: 20px;">
                    <h3>📄 Danh sách văn bản</h3>
                </div>
                
                <div class="filters-container">
                    <div class="filter-row">
                        <div class="input-group">
                            <label>🏢 PHÒNG BAN</label>
                            <select autocomplete="off" id="phong-ban-select" class="form-control">
                                <option value="">-- Tất cả --</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>👤 QUYỀN KÝ</label>
                            <select autocomplete="off" id="quyen-ky-select" class="form-control">
                                <option value="">-- Tất cả --</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>📄 LOẠI GIẤY TỜ</label>
                            <select autocomplete="off" id="doc-type-select" class="form-control">
                                <option value="">-- Tất cả loại giấy tờ --</option>
                            </select>
                        </div>
                    </div>
                    <div class="filter-row">
                        <div class="input-group">
                            <label>📅 TỪ NGÀY</label>
                            <input autocomplete="off" type="date" id="date-from" class="form-control">
                        </div>
                        <div class="input-group">
                            <label>📅 ĐẾN NGÀY</label>
                            <input autocomplete="off" type="date" id="date-to" class="form-control">
                        </div>
                        <div class="filter-actions" style="display: flex; align-items: flex-end;">
                            <button id="btn-refresh" class="btn-primary" style="padding: 12px 24px; display: flex; align-items: center; gap: 8px;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                                Làm mới
                            </button>
                        </div>
                    </div>
                </div>

                <div class="tabs-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <div style="display: flex; gap: 10px; background: rgba(15,23,42,0.6); padding: 5px; border-radius: 30px; border: 1px solid var(--glass-border);">
                        <button class="tab-btn active" data-tab="0">✍️ Chưa ký <span id="badge-chua-ky" class="badge">0</span></button>
                        <button class="tab-btn" data-tab="1">✅ Đã ký <span id="badge-da-ky" class="badge">0</span></button>
                    </div>
                    <button id="btn-batch-sign" class="btn btn-batch-action" style="display: none;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        Ký hàng loạt (<span id="batch-count">0</span>)
                    </button>
                </div>

                <div class="table-container">
                    <table id="docs-table">
                        <thead>
                            <tr>
                                <th style="width: 40px; text-align: center;"><input autocomplete="off" type="checkbox" id="chk-select-all" style="transform: scale(1.2); cursor: pointer;"></th>
                                <th>STT</th>
                                <th>Bệnh Nhân</th>
                                <th>Loại Giấy Tờ</th>
                                <th>Năm Sinh</th>
                                <th>Giới Tính</th>
                                <th>Số Bệnh Án</th>
                                <th>Trạng Thái</th>
                                <th>Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="docs-body">
                            <!-- JS sẽ render dữ liệu vào đây -->
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span id="page-info" style="font-size: 0.9em; opacity: 0.8;">Hiển thị 0 - 0/0 bản ghi</span>
                        <select autocomplete="off" id="page-size-select" style="background: var(--input-bg); color: var(--text-main); border: 1px solid var(--input-border); border-radius: 6px; padding: 4px 8px; cursor: pointer; outline: none; font-size: 0.9em;">
                            <option value="10" style="color: black;">10 dòng/trang</option>
                            <option value="20" style="color: black;" selected>20 dòng/trang</option>
                            <option value="50" style="color: black;">50 dòng/trang</option>
                            <option value="100" style="color: black;">100 dòng/trang</option>
                        </select>
                    </div>
                    <div class="page-controls">
                        <button id="btn-prev-page" class="btn-secondary" style="padding: 5px 15px;">&lt;</button>
                        <span id="current-page-num" style="padding: 0 10px; font-weight: bold;">1</span>
                        <button id="btn-next-page" class="btn-secondary" style="padding: 5px 15px;">&gt;</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Custom Confirm Modal -->
    <div id="confirm-modal" class="overlay hidden" style="z-index: 3000;">
        <div class="glass-panel confirm-box">
            <div class="confirm-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h3 id="confirm-title">Xác nhận thao tác</h3>
            <p id="confirm-msg">Bạn có chắc chắn muốn thực hiện thao tác này?</p>
            <div class="confirm-actions">
                <button id="btn-confirm-cancel" class="btn-cancel">Hủy</button>
                <button id="btn-confirm-ok" class="btn-danger">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- Màn hình chờ (Modal) -->
    <div id="loading-overlay" class="overlay hidden">
        <div class="glass-panel loading-box">
            <div class="spinner"></div>
            <h3 id="loading-title">Đang xử lý...</h3>
            <p id="loading-desc">Vui lòng chờ trong giây lát.</p>
        </div>
    </div>

    <!-- Màn hình xem PDF -->
    <div id="pdf-modal" class="overlay hidden" style="z-index: 2000;">
        <div class="glass-panel pdf-box" style="width: 90vw; height: 90vh; display: flex; flex-direction: column; padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="pdf-modal-title">Xem trước tài liệu</h3>
                <button id="btn-close-pdf" class="btn-cancel" style="padding: 5px 10px;">&times;</button>
            </div>
            <div style="flex: 1; background: #fff; border-radius: 8px; overflow: hidden;">
                <iframe id="pdf-viewer" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
            <div id="pdf-modal-actions" style="display: flex; justify-content: flex-end; gap: 16px; margin-top: 20px;">
                <button id="btn-pdf-cancel" class="btn-secondary" style="padding: 12px 32px; font-size: 1rem; border-radius: 12px; font-weight: 500;">Bỏ qua</button>
                <button id="btn-pdf-cancel-sign" class="btn-cancel" style="display: none; padding: 12px 32px; font-size: 1rem; border-radius: 12px; font-weight: 500;">Hủy ký</button>
                <button id="btn-pdf-sign" class="btn-primary" style="width: auto; min-width: 160px; padding: 12px 32px; margin-top: 0; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);">Ký số</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=1.0.17"></script>
</body>
</html>
